<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <!-- SCOPE app icon — 1024×1024, full-bleed black, centered reticle mark. -->
  <rect width="1024" height="1024" fill="#000000"/>
  <circle cx="512" cy="512" r="368" stroke="#FFFFFF" stroke-width="42" opacity="0.95"/>
  <!-- top index mark (accent) -->
  <line x1="512" y1="64" x2="512" y2="272" stroke="#00FF94" stroke-width="42" stroke-linecap="round"/>
  <!-- cardinal ticks -->
  <line x1="752" y1="512" x2="840" y2="512" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <line x1="512" y1="752" x2="512" y2="840" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <line x1="272" y1="512" x2="184" y2="512" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"/>
  <!-- center dot (accent) -->
  <circle cx="512" cy="512" r="52" fill="#00FF94"/>
</svg>
