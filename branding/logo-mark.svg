<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- SCOPE logo mark — scope reticle. White strokes + single green accent. -->
  <circle cx="32" cy="32" r="23" stroke="#FFFFFF" stroke-width="2.5" opacity="0.92"/>
  <!-- top index mark (accent) -->
  <line x1="32" y1="4" x2="32" y2="17" stroke="#00FF94" stroke-width="2.5" stroke-linecap="round"/>
  <!-- cardinal ticks -->
  <line x1="47" y1="32" x2="52.5" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="52.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="32" x2="11.5" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- center dot (accent) -->
  <circle cx="32" cy="32" r="3.2" fill="#00FF94"/>
</svg>
